# Build the private content repo with Cozyll's reusable site-ci workflow and
# publish it to GitHub Pages from this public repository.
#
# Content lives in MathiasSM/web-writings and is checked out by the reusable
# workflow with CONTENT_TOKEN. It must never be committed here.
name: Build and deploy

on:
  repository_dispatch:
    types: [content-updated]
  schedule:
    - cron: "0 6 1 * *" # 1st of every month at 06:00 UTC

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    name: Site CI
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    # PR #202 adds cross-repo content checkout and .cozyll-version resolution.
    # Bump this to the merged commit or the next release tag.
    uses: MathiasSM/Cozyll/.github/workflows/site-ci.yml@758fa78c4f87d9dbf4c42ca504bb3d0b3b7ea126
    with:
      content-repo: MathiasSM/web-writings
      run-links-external: true
    secrets:
      content-token: ${{ secrets.CONTENT_TOKEN }}

  guard:
    name: Guard against committed content
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - name: Guard against committed content
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git ls-tree -r --name-only HEAD -- content)" ]; then
            echo "content/ must never be committed to this repository" >&2
            exit 1
          fi

  deploy:
    name: Deploy
    needs: [site, guard]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site
      - name: Record the content commit
        env:
          GH_TOKEN: ${{ secrets.CONTENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api repos/MathiasSM/web-writings/commits/master --jq .sha)"
          echo "Content commit $sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Guard against private artefacts in the site
        shell: bash
        run: |
          set -euo pipefail
          bad="$(find _site \( -name '.git' -o -name '.git*' -o -name '.env*' \) -print)"
          hidden="$(find _site -name '.*' ! -path '_site/.well-known/*' ! -name '.well-known' ! -name '.nojekyll' -print)"
          if [ -n "$bad" ] || [ -n "$hidden" ] || [ -e _site/content ]; then
            printf 'refusing to publish unexpected paths:\n%s\n%s\n' "$bad" "$hidden" >&2
            [ -e _site/content ] && echo "_site/content is present" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
